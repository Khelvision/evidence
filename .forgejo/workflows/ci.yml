name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: evidence-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify framework
    runs-on: ci-light
    timeout-minutes: 10
    steps:
      # Bare action refs resolve through this Forgejo instance's reviewed action mirror.
      - uses: actions/checkout@v6
        with:
          github-server-url: https://avis-pbook.tail651ec3.ts.net
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Create isolated environment
        run: python -m venv --clear .venv-ci
      - name: Install package and development tools
        run: .venv-ci/bin/python -m pip install -e '.[dev]'
      - name: Ruff
        run: .venv-ci/bin/python -m ruff check .
      - name: Ruff format
        run: .venv-ci/bin/python -m ruff format --check .
      - name: Mypy
        run: .venv-ci/bin/python -m mypy src
      - name: Full suite with coverage floor
        run: .venv-ci/bin/python -m pytest
      - name: Build wheel
        run: .venv-ci/bin/python -m pip wheel --no-deps --wheel-dir dist .
      - name: Verify built wheel in a clean environment
        run: |
          python -m venv --clear .venv-wheel
          .venv-wheel/bin/python -m pip install dist/khelsutra_evidence-*.whl
          .venv-wheel/bin/evidence verify . > .venv-wheel/verify.json
          .venv-wheel/bin/python -c 'import json; data=json.load(open(".venv-wheel/verify.json")); print(json.dumps(data, sort_keys=True)); assert data == {"documents": 46, "status": "valid"}'
          .venv-wheel/bin/evidence package examples dist/examples.tar.gz
